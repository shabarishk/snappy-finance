services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snappy_finance}
      POSTGRES_USER: ${POSTGRES_USER:-snappy_finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-snappy_finance}
      PGUSER: ${POSTGRES_USER:-snappy_finance}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-6h}
      DEMO_DATA: ${DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-127.0.0.1:8081}:8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
